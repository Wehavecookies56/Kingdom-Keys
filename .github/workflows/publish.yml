name: Publish on CurseForge & Modrinth

on: [ workflow_dispatch ]

env:                                             
  JAVA_VERSION: 21
  MC_VERSION: 1.21.1
  RELEASE_NAME: Kingdom Keys
  MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v2
        with: 
          distribution: "temurin"
          java-version: "${{env.JAVA_VERSION}}"

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Get version number
        uses: BrycensRanch/read-properties-action@v1.0.4
        id: mod_version
        with:
          file: gradle.properties
          property: mod_version

      - name: Publish (CurseForge/Modrinth)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 242862
          curseforge-token: "${{env.CURSEFORGE_TOKEN}}"

          modrinth-id: DrsqKwVw
          modrinth-token: "${{env.MODRINTH_TOKEN}}"

          name: "${{env.RELEASE_NAME}} ${{steps.mod_version.outputs.mod_version}}"
          version: "${{steps.mod_version.outputs.mod_version}}-${{env.MC_VERSION}}"
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: "${{env.MC_VERSION}}"
          dependencies: |
            geckolib(required)
            
          java: "${{env.JAVA_VERSION}}"

      - name: Announce the new version in update.json
        run: ./gradlew updateJson --stacktrace

      - name: Commit update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json already up to date"
          else
            git commit -m "Announce ${{steps.mod_version.outputs.mod_version}} in update.json [skip ci]"
            git push origin HEAD:${{github.ref_name}}
          fi
